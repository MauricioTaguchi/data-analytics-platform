services:
  - type: web
    name: data-analytics-api
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    dockerCommand: /bin/sh scripts/start-render.sh
    disk:
      name: dataflow-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: data-analytics-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: data-analytics-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: CORS_ORIGINS
        value: '["https://data-analytics-web.onrender.com"]'
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: REPORT_DIR
        value: /var/data/reports

  - type: web
    name: data-analytics-web
    env: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: VITE_API_URL
        value: https://data-analytics-api.onrender.com/api/v1

  - type: redis
    name: data-analytics-redis
    ipAllowList: []

databases:
  - name: data-analytics-db
    databaseName: analytics
    user: analytics
