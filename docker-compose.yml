services:
  api:
    build: ./backend
    container_name: analytics-api
    env_file: [./backend/.env]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./backend:/app
      - analytics_uploads:/app/data/uploads
      - analytics_reports:/app/data/reports
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: ./backend
    container_name: analytics-worker
    env_file: [./backend/.env]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./backend:/app
      - analytics_uploads:/app/data/uploads
      - analytics_reports:/app/data/reports
    command: celery -A app.worker.celery_app worker --loglevel=info

  scheduler:
    build: ./backend
    container_name: analytics-scheduler
    env_file: [./backend/.env]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./backend:/app
      - analytics_uploads:/app/data/uploads
      - analytics_reports:/app/data/reports
    command: celery -A app.worker.celery_app beat --loglevel=info

  web:
    build: ./frontend
    container_name: analytics-web
    ports: ["5173:80"]
    depends_on:
      api: { condition: service_healthy }

  db:
    image: postgres:16-alpine
    container_name: analytics-db
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: analytics-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  analytics_uploads:
  analytics_reports:
