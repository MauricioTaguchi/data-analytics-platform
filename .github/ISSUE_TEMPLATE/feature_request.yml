name: Feature request
description: Propose a focused product or engineering improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operational problem without prescribing a solution first.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What observable outcome would make this request successful?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Include alternatives and trade-offs when known.
  - type: textarea
    id: operations
    attributes:
      label: Operational considerations
      description: Note expected impact on security, migrations, storage, performance, observability, or rollback.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request fits the production-minded portfolio scope described in the README.
          required: true
