changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Security
      labels:
        - security
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation and operations
      labels:
        - documentation
        - operations
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
