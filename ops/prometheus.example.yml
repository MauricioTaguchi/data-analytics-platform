global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/dataflow-alerts.yml
scrape_configs:
  - job_name: dataflow
    metrics_path: /api/v1/operations/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/dataflow_metrics_token
    static_configs:
      - targets: ["api:8000"]
