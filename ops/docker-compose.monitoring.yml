# Run from the repository root with docker-compose.yml as the first -f file.
services:
  prometheus:
    image: prom/prometheus:v3.13.5
    profiles: [monitoring]
    user: "65534:65534"
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/prometheus.example.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus-alerts.yml:/etc/prometheus/dataflow-alerts.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - dataflow_metrics_token
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  alertmanager:
    image: prom/alertmanager:v0.35.0
    profiles: [monitoring]
    user: "65534:65534"
    mem_limit: 128m
    cpus: 0.25
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./ops/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

secrets:
  dataflow_metrics_token:
    file: ${DATAFLOW_METRICS_TOKEN_FILE:?Set DATAFLOW_METRICS_TOKEN_FILE to an absolute secret-file path}

volumes:
  prometheus_data:
  alertmanager_data:
