# Opt-in template. Replace the reserved example URL and mount the receiver token.
# Never use a token in a URL. The default local-review configuration sends nothing.
route:
  receiver: operator-webhook
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: operator-webhook
    webhook_configs:
      - url: https://alerts.example.invalid/dataflow
        send_resolved: true
        max_alerts: 20
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/dataflow_alert_receiver_token
